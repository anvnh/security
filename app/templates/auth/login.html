{% extends "auth/base_auth.html" %}

{% block title %}Sign In — Bblog{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="card auth-card">
        <h2>Sign In</h2>
        <p class="subtitle">Enter your account credentials to read full articles and join the discussion.</p>

        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
            {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a
                    href="{{ url_for('auth.register', next=next_url) if next_url else url_for('auth.register') }}">Register
                    here</a></p>
        </div>
    </div>
</div>
{% endblock %}

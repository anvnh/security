{% extends "base.html" %}

{% block title %}Create Account — Blog{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="card auth-card">
        <h2>Create Account</h2>
        <p class="subtitle">Create an account to read full articles and join the discussion.</p>

        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
            {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username"
                    required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                    placeholder="Choose a password" required>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="2" class="form-control"
                    placeholder="Tell us something about yourself..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a
                    href="{{ url_for('auth.login', next=next_url) if next_url else url_for('auth.login') }}">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
